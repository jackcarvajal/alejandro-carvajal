          - generic [ref=f4e361]: +
        - generic: Sí. CoDiagnostiX tiene librerías de Neodent, Straumann, Nobel, Zimmer, Cortex, MIS, BioHorizons, Osstem y +100 marcas. Si tu implante no está disponible en el software, puedes enviar las anillas físicas y las colocamos manualmente.
      - generic [ref=f4e362]:
        - button "¿Cuánto tarda realmente desde que envío el CBCT? +" [ref=f4e363] [cursor=pointer]:
          - generic [ref=f4e364]: ¿Cuánto tarda realmente desde que envío el CBCT?
          - generic [ref=f4e365]: +
        - generic: "El proceso tiene dos etapas: evaluación de viabilidad (hasta 24h) y planificación digital (desde 4h según complejidad). El tiempo total depende de la demanda actual, la complejidad anatómica del caso y la densidad ósea. Un caso simple puede estar listo en menos de 24h total. Casos complejos (Full Arch, edéntulo total) requieren más tiempo."
      - generic [ref=f4e366]:
        - button "¿Puedo hacer flapless surgery con estas guías? +" [ref=f4e367] [cursor=pointer]:
          - generic [ref=f4e368]: ¿Puedo hacer flapless surgery con estas guías?
          - generic [ref=f4e369]: +
        - generic: Sí, siempre que el CBCT confirme bone sufficiency adecuado. Evaluamos la densidad ósea en el preplan y lo indicamos explícitamente. Para flapless se recomienda subfresado en zonas D3-D4 por la tendencia a sobreestimar la densidad en la CBCT.
      - generic [ref=f4e370]:
        - button "¿Cómo recibo la guía si estoy fuera de Colombia? +" [ref=f4e371] [cursor=pointer]:
          - generic [ref=f4e372]: ¿Cómo recibo la guía si estoy fuera de Colombia?
          - generic [ref=f4e373]: +
        - generic: Recibes el archivo STL para imprimir localmente en cualquier laboratorio con impresora SLA/DLP. El archivo STL es compatible con cualquier software de laminado dental (Chitubox, Asiga, NextDent, SprintRay). Si prefieres guía impresa, cotizamos envío internacional desde Colombia.
      - generic [ref=f4e374]:
        - button "¿Qué pasa si necesito ajustes en el preplan? +" [ref=f4e375] [cursor=pointer]:
          - generic [ref=f4e376]: ¿Qué pasa si necesito ajustes en el preplan?
          - generic [ref=f4e377]: +
        - generic: Hasta 2 revisiones incluidas en el precio antes de aprobar; si después de la segunda pides más cambios, cada una cuesta el 20 % del valor del diseño. La guía NO se fabrica hasta que el doctor apruebe explícitamente el diseño. Si requieres más de 2 rondas de cambio, se evalúa caso por caso. Tu seguridad clínica siempre es prioridad.
      - generic [ref=f4e378]:
        - button "¿Cuánto tiempo antes de la cirugía debo solicitar la guía? +" [ref=f4e379] [cursor=pointer]:
          - generic [ref=f4e380]: ¿Cuánto tiempo antes de la cirugía debo solicitar la guía?
          - generic [ref=f4e381]: +
        - generic: "Mínimo 72h antes: planificación (variable según complejidad) + impresión (24h) + prueba en boca (24h antes de cirugía según protocolo CDR). Recomendamos 5–7 días para casos con edéntulo total o anatomía compleja."
      - generic [ref=f4e382]:
        - button "¿Qué archivos necesito enviar exactamente? +" [ref=f4e383] [cursor=pointer]:
          - generic [ref=f4e384]: ¿Qué archivos necesito enviar exactamente?
          - generic [ref=f4e385]: +
        - generic: "Para guía dentosoportada: CBCT (DICOM, cortes 0.5mm, 150 micras, sin contacto oclusal), escáner intraoral ambas arcadas (.PLY o .STL), referencia exacta del implante (marca+diámetro+longitud) y zona a operar. Para edéntulo total: 2 CBCT + prótesis con marcadores radiopacos preparada."
