<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1200px;height:630px;background:#050505;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(212,175,55,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(212,175,55,.045) 1px,transparent 1px);background-size:60px 60px;}
.glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:860px;height:860px;background:radial-gradient(circle,rgba(217,70,166,.20) 0%,rgba(212,175,55,.10) 40%,transparent 70%);}
.content{position:relative;z-index:1;text-align:center;padding:60px;}
.badge{display:inline-flex;align-items:center;gap:8px;background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.3);border-radius:100px;padding:8px 24px;font-size:15px;font-weight:800;color:#D4AF37;letter-spacing:2px;text-transform:uppercase;margin-bottom:34px;}
h1{font-size:72px;font-weight:900;color:#fff;line-height:1.04;margin-bottom:22px;letter-spacing:-.5px;}
h1 span{background:linear-gradient(135deg,#D4AF37,#D946A6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.sub{font-size:24px;color:#cbd5e1;margin-bottom:34px;font-weight:600;}
.pills{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
.pill{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:100px;padding:10px 22px;font-size:17px;color:#e2e8f0;font-weight:600;}
.brand{position:absolute;bottom:30px;right:40px;font-size:17px;font-weight:800;color:#94a3b8;letter-spacing:2px;}
</style>
</head>
<body>
<div class="grid"></div>
<div class="glow"></div>
<div class="content">
  <div class="badge">👑 Diseño de carillas · Estética digital</div>
  <h1>Carillas <span>Hollywood o natural</span></h1>
  <p class="sub">Diseño en exocad · apruebas el mock-up 3D antes de producir</p>
  <div class="pills">
    <div class="pill">Disilicato · Feldespático · Circonio</div>
    <div class="pill">Smile design</div>
    <div class="pill">Yo lo diseño, tú lo produces</div>
  </div>
</div>
<div class="brand">alejandrocadcam.com</div>
</body>
</html>
