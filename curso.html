<style>
:root{--bg:#050505;--card:#0d1520;--mg:#D946A6;--gold:#D4AF37;--cyan:#00d2ff;--neon:#00FF41;--muted:#94a3b8;--border:rgba(255,255,255,.08);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
@font-face{font-family:"Inter Fallback";src:local("Arial");size-adjust:107.4%;ascent-override:90.2%;descent-override:22.5%;line-gap-override:0%;}
body{background:var(--bg);color:#e2e8f0;font-family:'Inter','Inter Fallback',-apple-system,sans-serif;overflow-x:hidden;line-height:1.6;}
a{color:inherit;text-decoration:none;}
main{position:relative;z-index:1;}
.container{max-width:1000px;margin:0 auto;padding:0 24px;}
.sec{padding:56px 0;}
.sec-title{font-size:clamp(1.5rem,3.5vw,2.1rem);font-weight:900;color:#fff;line-height:1.2;margin-bottom:12px;text-align:center;text-wrap:balance;}
.sec-sub{color:var(--muted);font-size:.95rem;max-width:560px;line-height:1.7;margin:0 auto 10px;text-align:center;}
.btn-p{background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;border:none;padding:14px 26px;border-radius:50px;font-size:.95rem;font-weight:800;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;box-shadow:0 8px 26px rgba(37,211,102,.28);}
.btn-o{background:transparent;border:1px solid rgba(0,210,255,.5);color:var(--cyan);padding:13px 24px;border-radius:50px;font-size:.92rem;font-weight:700;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;}
.migas{padding:96px 24px 0;max-width:1000px;margin:0 auto;font-size:.9rem;color:var(--muted);}
.migas a{color:var(--gold);}
/* Hero del curso */
.c-hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:36px;align-items:center;padding:22px 0 40px;}
.c-hero h1{font-size:clamp(1.7rem,4vw,2.5rem);font-weight:900;color:#fff;line-height:1.15;margin:12px 0;text-wrap:balance;}
.c-chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{font-size:.82rem;font-weight:700;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.07);color:#dbe3ee;}
.chip.basico{background:rgba(0,255,65,.1);color:var(--neon);}
.chip.intermedio{background:rgba(0,210,255,.12);color:var(--cyan);}
.chip.avanzado{background:rgba(217,70,166,.14);color:#f3b5dc;}
.c-inst{color:#cbd5e1;font-size:.95rem;}
.c-inst b{color:#fff;}
.c-datos{display:flex;flex-wrap:wrap;gap:8px 20px;margin:14px 0 0;color:#e8edf5;font-size:.92rem;font-weight:600;}
.c-datos span{display:inline-flex;align-items:center;gap:8px;}
.c-datos i{color:var(--gold);}
.c-img{aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#0e1520;border:1px solid var(--border);position:relative;}
.c-img img{width:100%;height:100%;object-fit:cover;display:block;}
.c-img span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.75);font-weight:900;font-size:1.5rem;background:linear-gradient(135deg,#1d2a3d,#0d1520 60%);border-bottom:3px solid var(--mg);}
.c-compra{margin-top:20px;display:flex;align-items:center;gap:14px 22px;flex-wrap:wrap;}
.cur-precio{font-size:1.5rem;font-weight:900;color:#fff;}
.cur-precio s{color:var(--muted);font-weight:600;font-size:.95rem;margin-right:6px;}
.cur-precio small{display:block;color:var(--muted);font-weight:600;font-size:.85rem;}
.c-nota{margin-top:10px;color:var(--muted);font-size:.88rem;}
/* Qué aprenderás */
.aprende{max-width:720px;margin:24px auto 0;list-style:none;display:grid;gap:12px;}
.aprende li{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;color:#dbe3ee;font-size:.95rem;line-height:1.6;}
.aprende i{color:var(--neon);margin-top:5px;}
.parrafo{max-width:720px;margin:24px auto 0;color:#cbd5e1;font-size:.98rem;line-height:1.8;text-align:center;white-space:pre-line;}
/* Temario */
.mods{max-width:760px;margin:26px auto 0;display:grid;gap:10px;}
.mod{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.mod summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:16px 18px;font-weight:800;color:#fff;font-size:1rem;}
.mod summary::-webkit-details-marker{display:none;}
.mod summary .mt{flex:1;min-width:0;}
.mod summary small{display:block;color:var(--muted);font-weight:600;font-size:.85rem;margin-top:2px;}
.mod summary .fl{color:var(--gold);transition:transform .2s;}
.mod[open] summary .fl{transform:rotate(90deg);}
.clases{list-style:none;border-top:1px solid var(--border);}
.clase{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border);font-size:.92rem;color:#dbe3ee;}
.clase:last-child{border-bottom:none;}
.clase i{color:var(--muted);width:16px;text-align:center;flex:none;}
.clase .ct{flex:1 1 140px;min-width:0;overflow-wrap:anywhere;}
.clase .cd{color:var(--muted);font-size:.85rem;white-space:nowrap;}
.muestra{display:inline-flex;align-items:center;gap:6px;color:var(--cyan);border:1px solid rgba(0,210,255,.5);border-radius:999px;padding:5px 12px;font-size:.82rem;font-weight:800;white-space:nowrap;}
.muestra:hover{background:rgba(0,210,255,.1);}
.clase.es-m i{color:var(--cyan);}
/* Instructor y cierre */
.inst{max-width:640px;margin:0 auto;text-align:center;}
.inst .ava{width:76px;height:76px;border-radius:50%;margin:0 auto 14px;background:linear-gradient(135deg,var(--gold),#9333ea);display:flex;align-items:center;justify-content:center;font-size:1.9rem;color:#050505;}
.inst h3{color:#fff;font-size:1.2rem;font-weight:800;}
.inst p{color:var(--muted);font-size:.95rem;margin-top:4px;}
.cierre{text-align:center;}
.cierre .c-compra{justify-content:center;}
/* Estados */
.estado{max-width:520px;margin:0 auto;padding:130px 24px 80px;text-align:center;}
.estado h2{font-size:1.5rem;color:#fff;font-weight:900;margin-bottom:10px;}
.estado p{color:var(--muted);font-size:.98rem;margin-bottom:22px;}
.cargando{padding:140px 24px;text-align:center;color:var(--muted);font-size:.95rem;}
[hidden]{display:none!important;}
@media(max-width:780px){
  .c-hero{grid-template-columns:1fr;gap:22px;}
  .c-img{order:-1;}
  .sec{padding:44px 0;}
  .container{padding:0 18px;}
  .migas{padding:84px 18px 0;}
  .clase{flex-wrap:wrap;}
  .clase .ct{flex-basis:calc(100% - 40px);}
  .btn-p,.btn-o{width:100%;}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}}
#main-content{min-height:80vh;} /* evita que el footer salte al pasar de «Cargando» a curso/estado */
</style>

<script src="js/geo-detect.js?v=20261011a" defer></script>
<script src="js/academia-publica.js?v=20261119a" defer></script>
<script>
/* Página pública de un curso (curso.html?slug=…). Lee con la anon key solo columnas públicas del curso y de sus
   clases publicadas (sin video_key). El JSON-LD Course se genera aquí. Todo valor de la base va escapado. */
(function () {
  var A, C = null, lecs = [], geoAct = null, $ = function (i) { return document.getElementById(i); };
  var slug = (new URLSearchParams(location.search).get('slug') || '').trim().slice(0, 80);
  var TOKEN_KEY = 'sb-zgihrwqfyvgyapbwzkvw-auth-token';

  function estado(t, p) { $('cargando').hidden = true; $('curso').hidden = true; $('estado-t').textContent = t; $('estado-p').textContent = p; $('estado').hidden = false; }
  function logueado() { try { var s = JSON.parse(localStorage.getItem(TOKEN_KEY) || 'null'); return !!(s && s.access_token); } catch (e) { return false; } }
  function hrefMuestra(l) {
    var dest = '/app/mi-academia.html?c=' + encodeURIComponent(C.slug) + '&l=' + encodeURIComponent(l.id);
    return logueado() ? dest : '/app/login.html?redirect=' + encodeURIComponent(dest);
  }
  function compra() {
    var h = A.precioHtml(C, geoAct) + '<a class="btn-p" href="' + A.esc(A.waInscribirse(C.titulo)) + '" target="_blank" rel="noopener noreferrer"><i class="fab fa-whatsapp" aria-hidden="true"></i> Inscribirme</a>';
    $('c-compra').innerHTML = h; $('c-compra2').innerHTML = h;
  }
  function modulos() {
    var mapa = {}, orden = [];
    lecs.forEach(function (l) {
      var k = String(Number(l.modulo_orden) || 1);
      if (!mapa[k]) { mapa[k] = { titulo: '', clases: [] }; orden.push(k); }
      if (!mapa[k].titulo && l.modulo_titulo) mapa[k].titulo = l.modulo_titulo;
      mapa[k].clases.push(l);
    });
    return orden.map(function (k, i) { var m = mapa[k]; m.n = i + 1; m.seg = m.clases.reduce(function (s, l) { return s + (Number(l.duracion_seg) || 0); }, 0); return m; });
  }
  function pintarTemario(mods) {
    var esc = A.esc;
    if (!lecs.length) { $('mods').innerHTML = '<p class="sec-sub">El temario se publica muy pronto.</p>'; return; }
    $('mods').innerHTML = mods.map(function (m, i) {
      var cab = (mods.length > 1 ? 'Módulo ' + m.n + (m.titulo ? ': ' + m.titulo : '') : (m.titulo || 'Clases'));
      var sub = m.clases.length + (m.clases.length === 1 ? ' clase' : ' clases') + (m.seg ? ' · ' + A.dur(m.seg) : '');
      return '<details class="mod"' + (i === 0 ? ' open' : '') + '><summary><span class="mt">' + esc(cab) + '<small>' + esc(sub) + '</small></span><i class="fas fa-chevron-right fl" aria-hidden="true"></i></summary><ul class="clases">'
        + m.clases.map(function (l) {
          var d = A.dur(l.duracion_seg);
          return '<li class="clase' + (l.es_muestra ? ' es-m' : '') + '"><i class="fas fa-' + (l.es_muestra ? 'play' : 'lock') + '" aria-hidden="true"></i><span class="ct">' + esc(l.titulo) + '</span>'
            + (l.es_muestra ? '<a class="muestra" href="' + esc(hrefMuestra(l)) + '"><i class="fas fa-play" aria-hidden="true"></i> Clase de muestra gratis</a>' : '')
            + (d ? '<span class="cd">' + esc(d) + '</span>' : '') + '</li>';
        }).join('') + '</ul></details>';
    }).join('');
  }
  function pintarAprende() {
    var txt = String(C.descripcion || '').trim(); if (!txt) return;
    var lineas = txt.split(/\r?\n+/).map(function (x) { return x.replace(/^[\s\-•*·]+/, '').trim(); }).filter(Boolean);
    if (lineas.length > 1) $('aprende').innerHTML = '<ul class="aprende">' + lineas.map(function (x) { return '<li><i class="fas fa-check" aria-hidden="true"></i><span>' + A.esc(x) + '</span></li>'; }).join('') + '</ul>';
    else { var p = document.createElement('p'); p.className = 'parrafo'; p.textContent = txt; $('aprende').appendChild(p); }
    $('sec-aprende').hidden = false;
  }
  function jsonld() {
    if (document.querySelector('script[data-curso-ld]')) return;   // ya lo puso el servidor (functions/curso.js)
    var o = { '@context': 'https://schema.org', '@type': 'Course', name: C.titulo, description: String(C.descripcion || C.titulo).slice(0, 500), inLanguage: 'es',
      url: location.origin + '/curso?slug=' + encodeURIComponent(C.slug),
      provider: { '@type': 'Organization', name: 'Alejandro CAD/CAM', url: 'https://alejandrocadcam.com' },
      hasCourseInstance: { '@type': 'CourseInstance', courseMode: 'online' } };
    if (C.portada_url && A.urlOk(C.portada_url)) o.image = A.urlOk(C.portada_url);
    if (C.software) o.about = C.software;
    if (C.nivel && A.NIVEL[C.nivel]) o.educationalLevel = A.NIVEL[C.nivel];
    var p = A.precioPlano(C);
    if (p) o.offers = { '@type': 'Offer', price: p.price, priceCurrency: p.currency, availability: 'https://schema.org/InStock', url: o.url, category: 'Paid' };
    var s = document.createElement('script'); s.type = 'application/ld+json'; s.textContent = JSON.stringify(o).replace(/</g, '\\u003c'); document.head.appendChild(s);
  }
  function metas() {
    var t = C.titulo + ' | Academia Alejandro CAD/CAM', d = String(C.descripcion || '').replace(/\s+/g, ' ').trim().slice(0, 155) || 'Curso grabado de diseño dental digital con Alejandro Carvajal.';
    var url = location.origin + '/curso?slug=' + encodeURIComponent(C.slug);
    document.title = t;
    function set(sel, attr, v) { var e = document.querySelector(sel); if (e) e.setAttribute(attr, v); }
    set('meta[name="description"]', 'content', d); set('meta[property="og:title"]', 'content', t); set('meta[property="og:description"]', 'content', d);
    set('link[rel="canonical"]', 'href', url); set('meta[property="og:url"]', 'content', url);
    var img = A.urlOk(C.portada_url); if (img) set('meta[property="og:image"]', 'content', /^\//.test(img) ? location.origin + img : img);
  }
  function pintar() {
    var esc = A.esc, mods = modulos(), seg = lecs.reduce(function (s, l) { return s + (Number(l.duracion_seg) || 0); }, 0);
    $('c-chips').innerHTML = (A.NIVEL[C.nivel] ? '<span class="chip ' + esc(C.nivel) + '">' + A.NIVEL[C.nivel] + '</span>' : '') + (C.software ? '<span class="chip">' + esc(C.software) + '</span>' : '');
    $('c-titulo').textContent = C.titulo; $('m-titulo').textContent = C.titulo;
    var inst = C.instructor || 'Alejandro Carvajal';
    $('c-inst').innerHTML = 'Con <b>' + esc(inst) + '</b>' + (C.instructor_especialidad ? ' · ' + esc(C.instructor_especialidad) : '');
    var datos = [];
    if (seg) datos.push(['clock', A.dur(seg) + ' de clases']);
    if (mods.length > 1) datos.push(['layer-group', mods.length + ' módulos']);
    if (lecs.length) datos.push(['video', lecs.length + (lecs.length === 1 ? ' clase' : ' clases')]);
    if (Number(C.horas_certificado)) datos.push(['award', 'Certificado de ' + Number(C.horas_certificado) + ' h']);
    $('c-datos').innerHTML = datos.map(function (d) { return '<span><i class="fas fa-' + d[0] + '" aria-hidden="true"></i>' + esc(d[1]) + '</span>'; }).join('');
    var img = A.urlOk(C.portada_url);
    $('c-img').innerHTML = img ? '<img src="' + esc(img) + '" alt="Portada del curso ' + esc(C.titulo) + '" width="800" height="450">' : '<span>' + esc(C.software || 'Academia') + '</span>';
    $('temario-sub').textContent = lecs.length ? (mods.length > 1 ? mods.length + ' módulos · ' : '') + lecs.length + (lecs.length === 1 ? ' clase' : ' clases') + (seg ? ' · ' + A.dur(seg) : '') : '';
    $('i-nombre').textContent = inst; $('i-esp').textContent = C.instructor_especialidad || '';
    pintarAprende(); pintarTemario(mods); compra(); metas(); jsonld();
    $('cargando').hidden = true; $('estado').hidden = true; $('curso').hidden = false;
  }
  function cargar() {
    A = window.ACAcad;
    if (!A) return estado('No pudimos abrir el curso.', 'Recarga la página en un momento.');
    if (!slug) return estado('Curso no encontrado', 'Elige un curso en la Academia.');
    A.rest('academia_cursos?select=id,slug,titulo,descripcion,nivel,software,instructor,instructor_especialidad,portada_url,horas_certificado,precio_cop,precio_usd,precio_antes_cop,academia_lecciones(id,modulo_orden,modulo_titulo,orden,titulo,duracion_seg,es_muestra,publicado)'
      + '&slug=eq.' + encodeURIComponent(slug) + '&publicado=eq.true&negocio=eq.alejandrocadcam&limit=1')
      .then(function (r) {
        if (!Array.isArray(r) || !r.length) return estado('No encontramos este curso', 'Puede que ya no esté disponible. Mira los cursos que sí están abiertos.');
        C = r[0];
        lecs = (Array.isArray(C.academia_lecciones) ? C.academia_lecciones : []).filter(function (l) { return l.publicado !== false; })
          .sort(function (a, b) { return (a.modulo_orden - b.modulo_orden) || (a.orden - b.orden); });
        pintar();
        if (window.ACGeo && ACGeo.onReady) ACGeo.onReady(function (g) { geoAct = g; compra(); });
      })
      .catch(function () { estado('La academia se está preparando', 'Vuelve en unos días o escríbeme por WhatsApp.'); });
  }
  document.addEventListener('DOMContentLoaded', cargar);
})();
</script>
<script src="js/footer.js?v=20261120a"></script>
<script>
  (function(){
    function _t(e,m){fetch('/api/track-event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({evento:e,pagina:window.location.pathname,negocio:'alejandrocadcam',metadata:m||{}})}).catch(function(){});}
    if('requestIdleCallback'in window)requestIdleCallback(function(){_t('page_view',{title:document.title});},{timeout:3000});
    else setTimeout(function(){_t('page_view',{title:document.title});},2000);
    window._trackEvent=_t;
  })();
